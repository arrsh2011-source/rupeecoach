<title>TrueCap Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one report column; the top band pairs score, red flags and category bars, detail sections stack below. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #5d6b78;
  --rule: #dfe4e9;
  --accent: #1f5fbf;
  --accent-soft: #e6eefa;
  --red: #c0352b; --red-soft: #fbeceb;
  --yellow: #a86a12; --yellow-soft: #fbf2e2;
  --green: #1d7f4a; --green-soft: #e7f5ed;
  --font-display: "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c0f; --surface: #11151a; --ink: #e8e4d8; --muted: #8b929b; --rule: #222932;
    --accent: #f0a33a; --accent-soft: #2a2114;
    --red: #ff6b5e; --red-soft: #2b1513; --yellow: #f2c14e; --yellow-soft: #2a2313; --green: #43cf8b; --green-soft: #10261b;
    --font-display: "IBM Plex Mono", ui-monospace, monospace; --radius: 3px; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c0f; --surface: #11151a; --ink: #e8e4d8; --muted: #8b929b; --rule: #222932;
  --accent: #f0a33a; --accent-soft: #2a2114;
  --red: #ff6b5e; --red-soft: #2b1513; --yellow: #f2c14e; --yellow-soft: #2a2313; --green: #43cf8b; --green-soft: #10261b;
  --font-display: "IBM Plex Mono", ui-monospace, monospace; --radius: 3px; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
a { color: var(--accent); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.sample-note { background: var(--accent-soft); color: var(--ink); font-size: 13px; }
.sample-note .wrap { padding-block: 8px; }
.disclaimer { border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.disclaimer .wrap { padding-block: 8px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: auto; }
.brand span { color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select, .btn { background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 10px; font-size: 13px; cursor: pointer; }
.btn:hover, select:hover { border-color: var(--accent); }

main .wrap { display: grid; gap: 28px; padding-block: 24px 64px; }
h1 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 30px); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 12px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; min-width: 0; }
.top { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; }
.top-right { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 760px) { .top { grid-template-columns: minmax(0, 1fr); } }

.score { display: grid; gap: 14px; align-content: start; align-self: start; }
.score p { margin: 0; }
.score-big { display: flex; align-items: baseline; gap: 6px; }
.score-big strong { font-family: var(--font-data); font-size: 64px; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
.score-big span { font-family: var(--font-data); color: var(--muted); font-size: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--rule); }
.conf-high { color: var(--green); background: var(--green-soft); border-color: transparent; }
.conf-medium { color: var(--yellow); background: var(--yellow-soft); border-color: transparent; }
.conf-low { color: var(--red); background: var(--red-soft); border-color: transparent; }
.meter { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--muted); }
.stage-note { font-size: 13px; color: var(--muted); }

.redlist { display: grid; gap: 10px; }
.redlist .empty { color: var(--muted); font-size: 14px; }

.cat { border-top: 1px solid var(--rule); }
.cat:first-of-type { border-top: 0; }
.cat-row { width: 100%; display: grid; grid-template-columns: 110px minmax(0, 1fr) 52px 18px; gap: 12px; align-items: center; background: none; border: 0; padding: 10px 0; cursor: pointer; text-align: left; }
.cat-name { font-weight: 600; }
.cat-name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.bar { height: 10px; background: var(--rule); border-radius: 2px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.bar.na { background: repeating-linear-gradient(45deg, var(--rule) 0 4px, transparent 4px 8px); }
.cat-score { text-align: right; font-weight: 600; }
.chev { color: var(--muted); transition: transform .15s; }
.cat[aria-expanded="true"] .chev { transform: rotate(90deg); }
.checks { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.check .o { font-family: var(--font-data); font-weight: 600; text-align: center; }
.o-pass { color: var(--green); } .o-fail { color: var(--red); } .o-unknown { color: var(--muted); }
.check b { font-weight: 600; }
.check p { margin: 2px 0 0; color: var(--muted); }
@media (max-width: 480px) { .cat-row { grid-template-columns: 84px minmax(0, 1fr) 40px 14px; gap: 8px; } }

.flag { border: 1px solid var(--rule); border-left: 4px solid var(--muted); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; background: var(--surface); }
.flag.red { border-left-color: var(--red); } .flag.yellow { border-left-color: var(--yellow); } .flag.green { border-left-color: var(--green); }
.flag-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sev { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.sev.red { color: var(--red); background: var(--red-soft); } .sev.yellow { color: var(--yellow); background: var(--yellow-soft); } .sev.green { color: var(--green); background: var(--green-soft); }
.flag-title { font-weight: 600; }
.flag p { margin: 0; }
.ask { font-size: 14px; color: var(--muted); }
.ask b { color: var(--ink); font-weight: 600; }
.flag-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.reply-link { font-size: 12px; color: var(--muted); }
.flags-grid { display: grid; gap: 10px; }

.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--font-data); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--accent); text-decoration: none; background: var(--bg); }
.chip:hover { border-color: var(--accent); }

.pc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .pc { grid-template-columns: minmax(0, 1fr); } }
.pc ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.pc li { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.pc li:last-child { border-bottom: 0; padding-bottom: 0; }
.impact { font-family: var(--font-data); font-size: 12px; font-weight: 600; color: var(--red); background: var(--red-soft); padding: 1px 7px; border-radius: 4px; }
.cat-tag { font-size: 12px; color: var(--muted); }
.row-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.st { font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-verified { color: var(--green); } .st-unverified { color: var(--yellow); } .st-not_found { color: var(--muted); }
.muted { color: var(--muted); }

ol.qs { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.manual { display: grid; gap: 10px; }
.manual div { display: grid; gap: 2px; }
.weights { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.weights div { border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px; text-align: center; }
.weights strong { display: block; font-family: var(--font-data); font-size: 20px; }
@media (max-width: 560px) { .weights { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
tr.hl td { background: var(--accent-soft); }
.rel { font-family: var(--font-data); font-size: 12px; white-space: nowrap; }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
</style>

<div class="sample-note" id="sample-note" hidden><div class="wrap">Preview built from TrueCap's scoring engine running on <b>fictional sample companies</b>. Source links point to placeholder <span class="num">.example</span> addresses.</div></div>
<header>
  <div class="wrap">
    <div class="brand">True<span>Cap</span></div>
    <div class="controls">
      <label for="company" id="company-label">Company
        <select id="company"></select>
      </label>
      <label for="stage">Stage
        <select id="stage">
          <option value="auto">Inferred</option>
          <option value="pre_seed">Pre-seed</option>
          <option value="seed">Seed</option>
          <option value="series_a">Series A</option>
          <option value="growth">Series B+</option>
        </select>
      </label>
      <button class="btn" id="theme" type="button">Dark theme</button>
    </div>
  </div>
</header>
<div class="disclaimer"><div class="wrap" id="disclaimer"></div></div>
<main><div class="wrap" id="app"></div></main>

<script>
const DATA = /*DATA*/;
const CAT = { team: "Team", market: "Market", traction: "Traction", financials: "Financials", legal: "Legal" };
const STAGE = { pre_seed: "Pre-seed", seed: "Seed", series_a: "Series A", growth: "Series B+" };
const OUT = { pass: "✓", fail: "✗", unknown: "?" };
const open = new Set();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chips = ids => ids && ids.length ? `<span class="chips">${ids.map(i => `<a class="chip" href="#ev-${i}" data-ev="${i}">${i}</a>`).join("")}</span>` : "";

function flagCard(f) {
  const replies = (f.replies || []).map(r => `<p class="ask"><b>Founder reply (${esc(r.submitted_by)}):</b> ${esc(r.body)}</p>`).join("");
  return `<article class="flag ${f.severity}">
    <div class="flag-head"><span class="sev ${f.severity}">${f.severity}</span><span class="flag-title">${esc(f.title)}</span><span class="cat-tag">${CAT[f.category]}</span></div>
    <p>${esc(f.detail)}</p>
    ${f.question ? `<p class="ask"><b>Ask:</b> ${esc(f.question)}</p>` : ""}
    ${replies}
    <div class="flag-foot">${chips(f.evidence_ids)}${f.severity !== "green" ? `<span class="reply-link">Founder of this company? Reply to this flag</span>` : ""}</div>
  </article>`;
}

function render() {
  const company = document.getElementById("company").value;
  const stageSel = document.getElementById("stage").value;
  const r = DATA.companies[company].reports[stageSel];
  const c = r.scorecard;
  document.getElementById("disclaimer").innerHTML = `${esc(r.disclaimer)} <a href="#methodology">How scoring works</a>`;
  const reds = r.flags.filter(f => f.severity === "red");
  const conf = c.confidence;

  const cats = c.categories.map(k => {
    const exp = open.has(k.category);
    const s = k.score;
    return `<div class="cat" aria-expanded="${exp}">
      <button class="cat-row" type="button" data-cat="${k.category}" aria-expanded="${exp}">
        <span class="cat-name">${CAT[k.category]}<small class="num">weight ${Math.round(k.weight * 100)}%</small></span>
        <span class="bar ${s === null ? "na" : ""}">${s === null ? "" : `<i style="width:${s * 10}%"></i>`}</span>
        <span class="cat-score num">${s === null ? "—" : s.toFixed(1)}</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      ${exp ? `<ul class="checks">${k.checks.map(ch => `<li class="check"><span class="o o-${ch.outcome}" title="${ch.outcome}">${OUT[ch.outcome]}</span><div><b>${esc(ch.title)}</b> ${chips(ch.evidence_ids)}<p>${esc(ch.detail)}</p></div></li>`).join("")}</ul>` : ""}
    </div>`;
  }).join("");

  const pros = r.pros.length ? r.pros.map(p => `<li><span>${esc(p.text)}</span><span class="row-meta"><span class="cat-tag">${CAT[p.category]}</span>${chips(p.evidence_ids)}</span></li>`).join("")
    : `<li class="muted">No verified strengths found in public sources.</li>`;
  const cons = r.cons.length ? r.cons.map(x => `<li><span>${esc(x.text)}</span>${x.question ? `<span class="ask"><b>Ask:</b> ${esc(x.question)}</span>` : ""}<span class="row-meta"><span class="impact">${x.category_impact.toFixed(1)} on ${CAT[x.category]}</span>${chips(x.evidence_ids)}</span></li>`).join("")
    : `<li class="muted">No failed checks.</li>`;
  const statusLabel = { verified: "Verified", unverified: "Unverified", not_found: "Not found" };
  const fund = r.fundamentals.map(f => `<tr><td>${esc(f.label)}</td><td>${f.value ? esc(f.value) : `<span class="muted">—</span>`}</td><td><span class="st st-${f.status}">${statusLabel[f.status]}</span></td><td>${chips(f.evidence_ids)}</td></tr>`).join("");
  const rel = { official: "Official", secondary: "Independent", self_reported: "Self-reported" };
  const ledger = r.evidence.map(e => `<tr id="ev-${e.id}"><td class="num">${e.id}</td><td class="rel">${rel[e.reliability]}</td><td>${esc(e.claim)}${e.excerpt ? `<div class="muted">“${esc(e.excerpt)}”</div>` : ""}</td><td class="num muted">${e.url && !DATA.sample ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url.replace(/^https?:\/\//, "").slice(0, 60))}</a>` : esc((e.url || "").replace(/^https?:\/\//, ""))}</td><td class="num muted">${e.fetched_at.slice(0, 10)}</td></tr>`).join("");

  document.getElementById("app").innerHTML = `
    <section>
      <h1>${esc(r.company_name)}</h1>
      <p class="sub">Generated ${r.generated_at.slice(0, 10)} · ${r.evidence.length} sources in the evidence ledger</p>
    </section>

    <section class="top">
      <div class="panel score">
        <span class="label">Diligence Score</span>
        <div class="score-big"><strong>${c.overall === null ? "—" : c.overall.toFixed(1)}</strong><span>/ 10</span></div>
        <div><span class="pill conf-${conf}">${conf[0].toUpperCase() + conf.slice(1)} confidence</span></div>
        <div>
          <div class="label" style="margin-bottom:6px">Checks decided: <span class="num">${Math.round(c.coverage * 100)}%</span></div>
          <div class="meter"><i style="width:${c.coverage * 100}%"></i></div>
        </div>
        <p class="stage-note"><b>${STAGE[r.stage.stage]} weights.</b> ${esc(r.stage.reason)}</p>
        <p class="stage-note">The score reflects how well public claims check out. Missing data lowers confidence, not the score.</p>
      </div>
      <div class="top-right">
        <div class="panel">
          <h2>Red flags <span class="num muted">(${reds.length})</span></h2>
          <div class="redlist">${reds.length ? reds.map(flagCard).join("") : `<p class="empty">No red flags from the checks that could be run.</p>`}</div>
        </div>
        <div class="panel">
          <h2>Categories</h2>
          ${cats}
        </div>
      </div>
    </section>

    <section class="pc">
      <div class="panel"><h2>Pros</h2><ul>${pros}</ul></div>
      <div class="panel"><h2>Cons</h2><ul>${cons}</ul></div>
    </section>

    <section class="panel">
      <h2>All flags</h2>
      <div class="flags-grid">${r.flags.length ? r.flags.map(flagCard).join("") : `<p class="muted">No flags.</p>`}</div>
    </section>

    <section class="panel">
      <h2>Fundamentals</h2>
      <div class="table-scroll"><table><thead><tr><th>Field</th><th>Value</th><th>Status</th><th>Source</th></tr></thead><tbody>${fund}</tbody></table></div>
    </section>

    <section class="panel">
      <h2>Questions to ask the founder</h2>
      ${r.questions.length ? `<ol class="qs">${r.questions.map(q => `<li>${esc(q.question)} <span class="cat-tag">· ${CAT[q.category]}</span></li>`).join("")}</ol>` : `<p class="muted">No open questions from the checks.</p>`}
    </section>

    ${r.manual_checks.length ? `<section class="panel">
      <h2>Verify yourself</h2>
      <p class="sub" style="margin:-6px 0 12px">These official portals need a CAPTCHA, so TrueCap doesn't query them. The related checks stay “unknown” until verified.</p>
      <div class="manual">${r.manual_checks.map(m => `<div><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a><span class="muted">${esc(m.why)}</span></div>`).join("")}</div>
    </section>` : ""}

    <section class="panel" id="methodology">
      <h2>How this score is built</h2>
      <p class="sub" style="margin:-6px 0 12px">Each category score is the share of its decided checks that passed, weighted by check importance. The overall score is the stage-weighted average below. Weights version <span class="num">${esc(c.weights_version)}</span>.</p>
      <div class="weights">${Object.entries(c.weights).map(([k, v]) => `<div><span class="label">${CAT[k]}</span><strong>${Math.round(v * 100)}%</strong></div>`).join("")}</div>
    </section>

    <section class="panel">
      <details id="ledger-details">
        <summary>Evidence ledger (${r.evidence.length} sources)</summary>
        <div class="table-scroll" style="margin-top:12px"><table><thead><tr><th>ID</th><th>Source type</th><th>Claim</th><th>URL</th><th>Fetched</th></tr></thead><tbody>${ledger}</tbody></table></div>
      </details>
    </section>`;
}

document.getElementById("app").addEventListener("click", e => {
  const row = e.target.closest(".cat-row");
  if (row) { const k = row.dataset.cat; open.has(k) ? open.delete(k) : open.add(k); render(); return; }
  const chip = e.target.closest(".chip");
  if (chip) {
    document.getElementById("ledger-details").open = true;
    document.querySelectorAll("tr.hl").forEach(t => t.classList.remove("hl"));
    const tr = document.getElementById("ev-" + chip.dataset.ev);
    if (tr) tr.classList.add("hl");
  }
});
document.getElementById("company").addEventListener("change", () => { open.clear(); render(); });
document.getElementById("stage").addEventListener("change", render);

const themeBtn = document.getElementById("theme");
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
const syncThemeBtn = () => { themeBtn.textContent = isDark() ? "Light theme" : "Dark theme"; };
themeBtn.addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; syncThemeBtn(); });
syncThemeBtn();
const companySel = document.getElementById("company");
for (const [key, c] of Object.entries(DATA.companies)) companySel.add(new Option(c.label, key));
document.getElementById("company-label").hidden = companySel.options.length < 2;
document.getElementById("sample-note").hidden = !DATA.sample;
render();
</script>
