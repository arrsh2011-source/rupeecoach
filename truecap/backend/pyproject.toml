[project]
name = "truecap"
version = "0.1.0"
description = "TrueCap: evidence-backed startup diligence (claim verification, not investment advice)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["truecap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
